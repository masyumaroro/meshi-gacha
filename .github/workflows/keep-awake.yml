name: Keep Render Awake

on:
  schedule:
    # GitHub cronの遅延対策として複数時刻に分散（*/10は遅延しやすい）
    - cron: '0,10,20,30,40,50 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Pinging Render backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://meshi-gacha.onrender.com/api/foods/gacha)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "ERROR: No response (server may still be sleeping)"
            exit 1
          fi
          echo "Server is awake"
