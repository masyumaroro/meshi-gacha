name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'  # 10分ごとに実行（Renderは15分でスリープ）
  workflow_dispatch:          # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          echo "Pinging Render backend..."
          curl -sf https://meshi-gacha.onrender.com/api/foods/gacha \
            --max-time 30 \
            --retry 2 \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n" \
            || echo "Ping returned non-2xx (may be no matching food, but server is awake)"
